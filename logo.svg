<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Darpan">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAD57A"/><stop offset="1" stop-color="#C98A1E"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#3E66CC"/><stop offset="1" stop-color="#0C1533"/>
    </radialGradient>
    <!-- Lotus petals: white at the heart, blushing pink towards the tips. -->
    <linearGradient id="outer" gradientUnits="userSpaceOnUse" x1="0" y1="-28" x2="4" y2="-64">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#FFF4F7"/><stop offset=".8" stop-color="#F9CFDC"/><stop offset="1" stop-color="#F2A7BF"/>
    </linearGradient>
    <linearGradient id="inner" gradientUnits="userSpaceOnUse" x1="0" y1="-28" x2="3" y2="-58">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#FDE7EE"/><stop offset="1" stop-color="#EE9DB8"/>
    </linearGradient>
    <!-- a soft fold down the middle, and the petal's shaded edge -->
    <linearGradient id="fold" gradientUnits="userSpaceOnUse" x1="-12" y1="0" x2="14" y2="0">
      <stop offset="0" stop-color="#C7708F" stop-opacity=".22"/><stop offset=".45" stop-color="#C7708F" stop-opacity="0"/>
      <stop offset=".6" stop-color="#FFFFFF" stop-opacity=".35"/><stop offset="1" stop-color="#C7708F" stop-opacity=".18"/>
    </linearGradient>
    <!-- Each petal leans the same way at its tip, so together they turn like a slow vortex. -->
    <g id="petal">
      <path d="M0-29C8.5-32 14-41 13.2-49.5C12.6-56 8.8-60.8 3.4-64.8C0.6-60.4-4.8-57.2-9.4-52.6C-13.6-48.2-11.6-36.4 0-29Z"/>
      <path d="M0-29C8.5-32 14-41 13.2-49.5C12.6-56 8.8-60.8 3.4-64.8C0.6-60.4-4.8-57.2-9.4-52.6C-13.6-48.2-11.6-36.4 0-29Z" fill="url(#fold)" stroke="none"/>
      <path d="M0-31C1.5-40 3.5-50 5-60" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width=".6" stroke-linecap="round"/>
    </g>
    <g id="bud">
      <path d="M0-29C7.2-31.4 11.9-39.1 11.2-46.3C10.7-51.8 7.5-55.9 2.9-59.3C0.5-55.6-4.1-52.9-8-49C-11.6-45.3-9.9-35.3 0-29Z"/>
      <path d="M0-29C7.2-31.4 11.9-39.1 11.2-46.3C10.7-51.8 7.5-55.9 2.9-59.3C0.5-55.6-4.1-52.9-8-49C-11.6-45.3-9.9-35.3 0-29Z" fill="url(#fold)" stroke="none"/>
    </g>
    <!-- the inner petals rest on the outer ones -->
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.6" stdDeviation="0.9" flood-color="#9A4A66" flood-opacity=".28"/>
    </filter>
  </defs>
  <g transform="translate(64 64)" stroke-linejoin="round">
    <g fill="url(#outer)" stroke="#D98AA6" stroke-opacity=".35" stroke-width=".8">
      <use href="#petal"/><use href="#petal" transform="rotate(45)"/><use href="#petal" transform="rotate(90)"/><use href="#petal" transform="rotate(135)"/>
      <use href="#petal" transform="rotate(180)"/><use href="#petal" transform="rotate(225)"/><use href="#petal" transform="rotate(270)"/><use href="#petal" transform="rotate(315)"/>
    </g>
    <g filter="url(#lift)" fill="url(#inner)" stroke="#D98AA6" stroke-opacity=".35" stroke-width=".7">
      <use href="#bud" transform="rotate(22.5)"/><use href="#bud" transform="rotate(67.5)"/><use href="#bud" transform="rotate(112.5)"/><use href="#bud" transform="rotate(157.5)"/>
      <use href="#bud" transform="rotate(202.5)"/><use href="#bud" transform="rotate(247.5)"/><use href="#bud" transform="rotate(292.5)"/><use href="#bud" transform="rotate(337.5)"/>
    </g>
    <g stroke="#8E5B0E">
      <circle r="38" fill="url(#gold)" stroke-width="1.5"/>
      <circle r="34.5" fill="none" stroke="#B57B19" stroke-width="1"/>
      <circle r="31" fill="url(#glass)" stroke="#7A4C0B" stroke-width="1.5"/>
    </g>
    <path d="M-23-6A23 23 0 0 1-6-23" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-9-17V11L-2.5 4.5 2 14.5 6.5 12.5 2 2.5H11Z" fill="#fff" stroke="#0C1533" stroke-width="2.2"/>
  </g>
</svg>
